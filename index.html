<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Sentence Game 🤌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0820;font-family:'Segoe UI',Kanit,system-ui,sans-serif}
#SS{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:20px}
.gc{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:30px 26px;max-width:430px;width:100%;text-align:center}
#GA{position:fixed;inset:0;z-index:1}
#VD{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#CV{position:absolute;inset:0;width:100%;height:100%;cursor:none}
</style>
</head>
<body>

<div id="SS">
  <div class="gc">
    <div style="font-size:52px;margin-bottom:6px">🤌</div>
    <h1 style="color:#fff;font-size:21px;font-weight:800;margin-bottom:4px">AR Sentence Game</h1>
    <p style="color:rgba(255,255,255,0.38);font-size:13px;margin-bottom:18px">เรียงคำศัพท์ภาษาอังกฤษด้วยมือ</p>
    <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:12px 14px;margin-bottom:18px;text-align:left">
      <p style="color:rgba(165,180,252,0.5);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px">วิธีเล่น</p>
      <div style="color:rgba(255,255,255,0.62);font-size:14px;line-height:2.1">
        🤌 จีบนิ้วโป้ง+ชี้ = หยิบคำ<br>
        🖐️ กางนิ้วออก = วาง<br>
        🎯 เรียงให้ตรงกับโจทย์ภาษาไทย<br>
        🖱️ ใช้เมาส์ลากวางได้เช่นกัน
      </div>
    </div>
    <button onclick="startGame()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 6px 24px rgba(99,102,241,0.4)">เข้าสู่เกม 🚀</button>
    <p style="color:rgba(255,255,255,0.18);font-size:11px;margin-top:10px">กล้องจะถูกขอสิทธิ์ (ไม่มีก็ใช้เมาส์ได้)</p>
  </div>
</div>

<div id="GA">
  <video id="VD" playsinline autoplay muted></video>
  <canvas id="CV"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script>
/* ════ LEVEL DATA ════ */
const LEVELS=[
  {th:'ฉัน รัก สุนัข',          words:['I','love','dogs'],        emojis:['👤','❤️','🐕'],      answer:['I','love','dogs']},
  {th:'แมว ตัวนั้น น่ารัก',      words:['The','cat','is','cute'],  emojis:['📌','🐈','✨','🌸'],  answer:['The','cat','is','cute']},
  {th:'นก บิน อยู่ใน ท้องฟ้า',  words:['Birds','fly','in','sky'], emojis:['🐦','🌤️','📍','☁️'], answer:['Birds','fly','in','sky']},
  {th:'ฉัน มีความสุข มาก',      words:['I','am','very','happy'], emojis:['🙋','✨','💯','😊'],   answer:['I','am','very','happy']},
  {th:'พวกเขา เป็น เพื่อนที่ดีที่สุด', words:['They','are','best','friends'], emojis:['👥','✨','🏆','🤝'], answer:['They','are','best','friends']},
  {th:'อากาศ หนาวมาก เมื่อวาน',  words:['The','weather','was','cold'],  emojis:['📌','🌦️','✨','🥶'], answer:['The','weather','was','cold']},
  {th:'พวกเรา เหนื่อยมาก เมื่อคืน', words:['We','were','so','tired'],     emojis:['👥','✨','❗','😴'],  answer:['We','were','so','tired']},
  {th:'เธอ จะโด่งดัง ในอนาคต',    words:['She','will','be','famous'],   emojis:['👧','🔗','✨','🌟'],  answer:['She','will','be','famous']},
  {th:'เขา ยุ่งมาก ช่วงนี้',       words:['He','has','been','busy'],     emojis:['🙋\u200d♂️','🔗','✨','💼'], answer:['He','has','been','busy']},
  {th:'นักเรียน เรียน ภาษาอังกฤษ', words:['Students','study','English'], emojis:['🎓','📖','🔤'],      answer:['Students','study','English']},
];

/* ════ CANVAS ════ */
const CV=document.getElementById('CV'),ctx=CV.getContext('2d'),VD=document.getElementById('VD');
let W=0,H=0;
function resize(){W=CV.width=window.innerWidth;H=CV.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

/* ════ STATE ════ */
const gs={phase:'guide',level:0,score:0,cards:[],slots:[],grab:-1,grabOff:{x:0,y:0},timer:0,wrongMsg:0};
const HS={on:false,lm:[],tip:{x:0,y:0},pinch:false};
const MS={x:0,y:0,down:false};
let prevPinch=false;

function CX(){return HS.on?HS.tip.x:MS.x;}
function CY(){return HS.on?HS.tip.y:MS.y;}
function PINCH(){return HS.on?HS.pinch:MS.down;}

/* ════ INPUT ════ */
function cpt(e){const r=CV.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
CV.addEventListener('mousemove',e=>{const p=cpt(e);MS.x=p.x;MS.y=p.y;});
CV.addEventListener('mousedown',e=>{const p=cpt(e);MS.x=p.x;MS.y=p.y;MS.down=true;});
CV.addEventListener('mouseup',()=>{MS.down=false;});
CV.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=CV.getBoundingClientRect();MS.x=(t.clientX-r.left)*(W/r.width);MS.y=(t.clientY-r.top)*(H/r.height);MS.down=true;},{passive:false});
CV.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=CV.getBoundingClientRect();MS.x=(t.clientX-r.left)*(W/r.width);MS.y=(t.clientY-r.top)*(H/r.height);},{passive:false});
CV.addEventListener('touchend',e=>{e.preventDefault();MS.down=false;},{passive:false});

/* ════ MEDIAPIPE ════ */
function setupMP(){
  if(typeof Hands==='undefined')return;
  try{
    const mp=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
    mp.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.5});
    mp.onResults(res=>{
      if(res.multiHandLandmarks&&res.multiHandLandmarks.length){
        const lm=res.multiHandLandmarks[0];
        HS.on=true;
        HS.lm=lm.map(p=>({x:(1-p.x)*W,y:p.y*H})); // mirror x to match video CSS flip
        HS.tip={x:(1-lm[8].x)*W,y:lm[8].y*H};
        const dx=lm[4].x-lm[8].x,dy=lm[4].y-lm[8].y;
        HS.pinch=Math.sqrt(dx*dx+dy*dy)<0.07; // Pythagorean pinch distance
      }else{HS.on=false;}
    });
    if(typeof Camera!=='undefined'){
      new Camera(VD,{onFrame:async()=>{await mp.send({image:VD});},width:640,height:480})
        .start().catch(()=>{});
    }
  }catch(e){console.warn('MediaPipe unavailable:',e);}
}

/* ════ START / INIT ════ */
function startGame(){
  document.getElementById('SS').style.display='none';
  setupMP();
  requestAnimationFrame(loop); // draw loop is INDEPENDENT from MediaPipe onResults
}

function initLevel(lv){
  const L=LEVELS[lv],n=L.words.length;
  const cw=Math.min(110,(W*0.84)/n-14),ch=Math.round(cw*1.32);
  const tot=n*(cw+14)-14,sx=(W-tot)/2,sy=H*0.13;
  gs.cards=L.words.map((word,i)=>({
    id:i,word,emoji:L.emojis[i],
    x:sx+i*(cw+14), y:sy+(i%2)*ch*0.2,
    ox:sx+i*(cw+14),oy:sy+(i%2)*ch*0.2,
    w:cw,h:ch,slot:-1,
  }));
  const slotY=H-ch-Math.max(22,H*0.035);
  gs.slots=L.answer.map((word,i)=>({id:i,word,filledBy:-1,x:sx+i*(cw+14),y:slotY,w:cw,h:ch}));
  gs.grab=-1;gs.wrongMsg=0;gs.phase='playing';
}

function resetGame(){
  Object.assign(gs,{level:0,score:0,cards:[],slots:[],grab:-1,wrongMsg:0,timer:0,phase:'guide'});
}

/* ════ BUTTON RECTS (computed same as drawn) ════ */
function guideBtnRect(){const ph=360,py=(H-ph)/2,bw=200,bh=52;return{x:(W-bw)/2,y:py+ph-74,w:bw,h:bh};}
function allClearBtnRect(){return{x:W/2-100,y:H/2+70,w:200,h:48};}

/* ════ UPDATE ════ */
function hit(x,y,c){return x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h;}

function update(){
  const pinchNow=PINCH(),pS=pinchNow&&!prevPinch,pE=!pinchNow&&prevPinch;
  const x=CX(),y=CY();
  if(gs.wrongMsg>0)gs.wrongMsg--;

  /* guide */
  if(gs.phase==='guide'){
    if(pS){const b=guideBtnRect();if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)initLevel(0);}
    prevPinch=pinchNow;return;
  }
  /* level clear */
  if(gs.phase==='levelClear'){
    if(--gs.timer<=0){gs.level+1>=LEVELS.length?(gs.phase='allClear'):(gs.level++,initLevel(gs.level));}
    prevPinch=pinchNow;return;
  }
  /* all clear */
  if(gs.phase==='allClear'){
    if(pS){const b=allClearBtnRect();if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)resetGame();}
    prevPinch=pinchNow;return;
  }

  /* playing */
  const{cards,slots}=gs;
  if(gs.grab===-1){
    if(pS){
      for(let i=cards.length-1;i>=0;i--){
        if(hit(x,y,cards[i])){
          const c=cards[i];
          if(c.slot!==-1){slots[c.slot].filledBy=-1;c.slot=-1;} // pick up from slot
          gs.grab=i;gs.grabOff={x:x-c.x,y:y-c.y};break;
        }
      }
    }
  }else{
    const gc=cards[gs.grab];
    gc.x=x-gs.grabOff.x;gc.y=y-gs.grabOff.y;
    if(pE){
      const gcx=gc.x+gc.w/2,gcy=gc.y+gc.h/2;
      let placed=false;
      for(let i=0;i<slots.length;i++){
        const s=slots[i];
        if(s.filledBy!==-1)continue;
        if(gcx>=s.x&&gcx<=s.x+s.w&&gcy>=s.y&&gcy<=s.y+s.h){
          gc.slot=i;gc.x=s.x;gc.y=s.y;s.filledBy=gs.grab;placed=true;break;
        }
      }
      if(!placed){gc.x=gc.ox;gc.y=gc.oy;} // snap back to origin
      gs.grab=-1;
    }
  }

  /* win check */
  if(slots.every(s=>s.filledBy!==-1)){
    if(slots.every(s=>cards[s.filledBy].word===s.word)){
      gs.score+=100;gs.phase='levelClear';gs.timer=130;
    }else{
      slots.forEach(s=>{
        if(s.filledBy!==-1&&cards[s.filledBy].word!==s.word){
          const c=cards[s.filledBy];c.x=c.ox;c.y=c.oy;c.slot=-1;s.filledBy=-1;
        }
      });
      gs.wrongMsg=90;
    }
  }
  prevPinch=pinchNow;
}

/* ════ DRAW UTILITIES ════ */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function ov(a){ctx.fillStyle=`rgba(8,5,22,${a})`;ctx.fillRect(0,0,W,H);}

/* ── Word Card (2.5D glassmorphism) ── */
function drawCard(c,grabbed){
  const{x,y,w,h,emoji,word}=c;
  ctx.save();
  ctx.translate(x+w/2,y+h/2);
  ctx.rotate(grabbed?0.05:0);
  ctx.shadowColor=grabbed?'rgba(99,102,241,0.7)':'rgba(0,0,0,0.55)';
  ctx.shadowBlur=grabbed?30:12;ctx.shadowOffsetY=grabbed?10:5;
  rr(-w/2,-h/2,w,h,12);
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,'rgba(255,255,255,0.19)');g.addColorStop(1,'rgba(255,255,255,0.07)');
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetY=0;
  rr(-w/2,-h/2,w,h,12);
  ctx.strokeStyle=grabbed?'rgba(99,102,241,0.9)':'rgba(255,255,255,0.26)';
  ctx.lineWidth=grabbed?2:1;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${Math.round(w*0.38)}px serif`;ctx.fillStyle='#fff';
  ctx.fillText(emoji,0,-h*0.1);
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-w/2+10,h*0.22);ctx.lineTo(w/2-10,h*0.22);ctx.stroke();
  ctx.font=`bold ${Math.max(11,Math.round(w*0.155))}px Segoe UI`;
  ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(word,0,h*0.37);
  ctx.restore();
}

/* ── Drop Slot ── */
function drawSlot(s){
  if(s.filledBy!==-1){drawCard(gs.cards[s.filledBy],false);return;}
  ctx.save();
  rr(s.x,s.y,s.w,s.h,12);
  ctx.strokeStyle='rgba(255,255,255,0.33)';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([]);
  ctx.font='13px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${s.id+1}`,s.x+s.w/2,s.y+s.h/2);
  ctx.restore();
}

/* ── Hand Skeleton ── */
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
function drawHand(){
  if(!HS.on||!HS.lm.length)return;
  ctx.save();ctx.globalAlpha=0.5;
  ctx.strokeStyle='#818cf8';ctx.lineWidth=2;
  CONN.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(HS.lm[a].x,HS.lm[a].y);ctx.lineTo(HS.lm[b].x,HS.lm[b].y);ctx.stroke();});
  HS.lm.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p.x,p.y,i===4||i===8?6:3,0,Math.PI*2);
    ctx.fillStyle=i===4||i===8?'#fbbf24':'#a5b4fc';ctx.fill();
  });
  ctx.restore();
}

/* ── Cursor States ── */
function drawCursor(){
  const x=CX(),y=CY();if(!x&&!y)return;
  let color='#60a5fa',dashed=false,r=16,label='';
  if(gs.grab!==-1){color='#34d399';label='✔️';r=19;}
  else{
    const hov=gs.cards.some(c=>c.slot===-1&&hit(x,y,c));
    if(hov){color='#fbbf24';dashed=true;r=19;}
    else if(PINCH()){color='#ef4444';r=13;}
  }
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(dashed)ctx.setLineDash([5,4]);
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  if(label){ctx.font='15px serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+22,y-8);}
  ctx.restore();
}

/* ════ DRAW PHASES ════ */
function drawGuide(){
  ov(0.62);
  const pw=Math.min(480,W-40),ph=360,px=(W-pw)/2,py=(H-ph)/2;
  rr(px,py,pw,ph,20);ctx.fillStyle='rgba(255,255,255,0.09)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 26px Segoe UI';ctx.fillStyle='#fff';ctx.fillText('วิธีเล่น 🎮',W/2,py+52);
  [['🤌','จีบนิ้วโป้ง+ชี้ = หยิบคำ'],['🖐️','กางนิ้วออก = วาง'],['🎯','เรียงคำให้ตรงโจทย์'],['🖱️','ใช้เมาส์ลากวางได้']].forEach(([em,txt],i)=>{
    const sy=py+100+i*48;
    ctx.textAlign='center';ctx.font='22px serif';ctx.fillStyle='#fff';ctx.fillText(em,px+46,sy);
    ctx.textAlign='left';ctx.font='15px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.72)';ctx.fillText(txt,px+70,sy);
  });
  // "เริ่มเกม!" button ON canvas — interactable via hand pinch or mouse click
  const b=guideBtnRect(),over=CX()>=b.x&&CX()<=b.x+b.w&&CY()>=b.y&&CY()<=b.y+b.h;
  rr(b.x,b.y,b.w,b.h,14);ctx.fillStyle=over?'#22c55e':'#16a34a';ctx.fill();
  ctx.font='bold 20px Segoe UI';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('เริ่มเกม! 🚀',W/2,b.y+b.h/2);ctx.textBaseline='alphabetic';
}

function drawPlaying(){
  ov(0.52);
  const L=LEVELS[gs.level];
  const hbw=Math.min(460,W-80);
  rr((W-hbw)/2,10,hbw,46,11);ctx.fillStyle='rgba(0,0,0,0.52)';ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 13px Segoe UI';ctx.fillStyle='rgba(165,180,252,0.7)';ctx.fillText('โจทย์:',W/2-hbw*0.14,38);
  ctx.font='bold 16px Segoe UI';ctx.fillStyle='#fff';ctx.fillText(L.th,W/2+hbw*0.07,38);
  ctx.textAlign='left';ctx.font='bold 13px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(`ด่าน ${gs.level+1}/${LEVELS.length}`,14,26);
  ctx.textAlign='right';ctx.fillStyle='#fbbf24';ctx.fillText(`⭐ ${gs.score}`,W-14,26);

  // Wrong-order flash message (fades out over last 30 frames)
  if(gs.wrongMsg>0){
    ctx.save();ctx.globalAlpha=Math.min(gs.wrongMsg/30,1);
    rr(W/2-172,H/2-28,344,56,12);ctx.fillStyle='rgba(239,68,68,0.9)';ctx.fill();
    ctx.font='bold 17px Segoe UI';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('❌ ลำดับยังไม่ถูก ลองใหม่!',W/2,H/2);ctx.restore();
  }

  if(gs.slots.length){
    ctx.textAlign='center';ctx.font='12px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.35)';ctx.textBaseline='alphabetic';
    ctx.fillText('▼ วางคำลงในช่องให้ถูกลำดับ',W/2,gs.slots[0].y-10);
  }
  gs.slots.forEach(s=>drawSlot(s));
  gs.cards.forEach((c,i)=>{if(c.slot===-1&&i!==gs.grab)drawCard(c,false);});
  drawHand();
  if(gs.grab!==-1)drawCard(gs.cards[gs.grab],true);

  // "กำลังหามือของคุณ..." when hand not detected
  if(!HS.on){
    ctx.textAlign='center';ctx.font='13px Segoe UI';ctx.fillStyle='rgba(251,191,36,0.72)';ctx.textBaseline='alphabetic';
    ctx.fillText('กำลังหามือของคุณ... 👋',W/2,H-14);
  }
}

function drawLevelClear(){
  ov(0.7);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 42px Segoe UI';ctx.fillStyle='#34d399';ctx.fillText(`✅ ด่าน ${gs.level+1} ผ่านแล้ว!`,W/2,H/2-22);
  ctx.font='22px Segoe UI';ctx.fillStyle='#fbbf24';ctx.fillText(`+100 คะแนน ⭐  รวม ${gs.score}`,W/2,H/2+28);
}

function drawAllClear(){
  ov(0.72);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 52px Segoe UI';ctx.fillStyle='#fbbf24';ctx.fillText('🏆 All Clear!',W/2,H/2-50);
  ctx.font='bold 24px Segoe UI';ctx.fillStyle='#34d399';ctx.fillText(`คะแนนรวม: ${gs.score} คะแนน`,W/2,H/2+10);
  const b=allClearBtnRect(),over=CX()>=b.x&&CX()<=b.x+b.w&&CY()>=b.y&&CY()<=b.y+b.h;
  rr(b.x,b.y,b.w,b.h,13);ctx.fillStyle=over?'#7c3aed':'#6366f1';ctx.fill();
  ctx.font='bold 17px Segoe UI';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('เล่นอีกครั้ง 🔄',W/2,b.y+b.h/2);
}

/* ════ MAIN LOOP ════
   requestAnimationFrame runs independently.
   MediaPipe onResults updates HS asynchronously.
   The two systems never block each other.
════ */
function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  update();
  switch(gs.phase){
    case'guide':      drawGuide();      break;
    case'playing':    drawPlaying();    break;
    case'levelClear': drawLevelClear(); break;
    case'allClear':   drawAllClear();   break;
  }
  drawCursor(); // always on top
}
</script>
